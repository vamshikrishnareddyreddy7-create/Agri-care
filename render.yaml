services:
  - type: web
    name: agri-care-farm-equipment
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c \"import joblib; joblib.load('model/predictive_model.pkl'); print('ML model OK')\""
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      # Render MySQL: create a MySQL instance, then paste its Internal Database
      # URL here (Render injects it automatically when the DB is linked).
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
