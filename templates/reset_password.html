<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — {{ APP_NAME }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23166534'/%3E%3Cpath d='M32 12c2 14-8 24-20 26 2 13 12 22 20 24 8-2 18-11 20-24-12-2-22-12-20-26z' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="back-link" href="{{ url_for('login') }}">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to login
  </a>
  <div class="auth-logo">
    <span class="brand-badge"><svg viewBox="0 0 24 24"><path d="M12 3c.5 4.5-2.5 8-7 8.5C5.5 8 8.5 4 12 3z"/><path d="M12 3c-.5 4.5 2.5 8 7 8.5C18.5 8 15.5 4 12 3z"/><path d="M12 11.5V21"/></svg></span>
    {{ APP_NAME }}
  </div>
  <h1>Choose a new password</h1>
  <p class="sub">Enter a new password for your AgriCare account.</p>

  <form id="resetForm" novalidate>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="field" id="f-password">
        <label for="password">New Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
        <span class="err-msg">Password must be at least 6 characters.</span>
      </div>
      <div class="field" id="f-confirm">
        <label for="confirm_password">Confirm New Password <span class="req">*</span></label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat the new password" autocomplete="new-password" required>
        <span class="err-msg">Passwords do not match.</span>
      </div>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="resetBtn" style="margin-top:6px">Update Password</button>
  </form>

  <div id="successBox" class="demo-box" style="display:none;margin-top:16px">
    <b>✓ Password updated</b><br>
    You can now log in with your new password.
    <a id="goLogin" href="{{ url_for('login') }}" class="btn btn-primary btn-block" style="margin-top:12px">Go to Login</a>
  </div>

  <p class="auth-foot">
    Didn't request this? <a href="{{ url_for('login') }}">Back to Login</a>
  </p>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
(function () {
  var TOKEN = {{ token | tojson }};
  var form = document.getElementById("resetForm");
  var btn = document.getElementById("resetBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = document.getElementById("password").value;
    var confirm = document.getElementById("confirm_password").value;
    var short = pass.length < 6;
    var mismatch = pass !== confirm;
    document.getElementById("f-password").classList.toggle("error", short);
    document.getElementById("f-confirm").classList.toggle("error", mismatch);
    if (short || mismatch) return;

    setBtnLoading(btn, true);
    API.resetPassword(TOKEN, pass, confirm)
      .then(function (d) {
        form.style.display = "none";
        document.getElementById("successBox").style.display = "block";
        toast(d.message || "Password updated.", "success");
      })
      .catch(function (err) {
        setBtnLoading(btn, false, "Update Password");
        handleApiError(err);
      });
  });
})();
</script>
</body>
</html>
