<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ APP_NAME }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23166534'/%3E%3Cpath d='M32 12c2 14-8 24-20 26 2 13 12 22 20 24 8-2 18-11 20-24-12-2-22-12-20-26z' fill='%2322c55e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
  <a class="back-link" href="{{ url_for('index') }}">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to home
  </a>
  <div class="auth-logo">
    <span class="brand-badge"><svg viewBox="0 0 24 24"><path d="M12 3c.5 4.5-2.5 8-7 8.5C5.5 8 8.5 4 12 3z"/><path d="M12 3c-.5 4.5 2.5 8 7 8.5C18.5 8 15.5 4 12 3z"/><path d="M12 11.5V21"/></svg></span>
    {{ APP_NAME }}
  </div>
  <h1>Welcome back, Farmer</h1>
  <p class="sub">Log in to manage your equipment and maintenance.</p>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form id="loginForm" method="post" action="{{ url_for('login') }}" novalidate>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="field" id="f-email">
        <label for="email">Email or Phone <span class="req">*</span></label>
        <input type="text" id="email" name="email" placeholder="you@farm.com or +91 9876543210" autocomplete="username" required>
        <span class="err-msg">Enter your email or phone number.</span>
      </div>
      <div class="field" id="f-password">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <span class="err-msg">Enter your password.</span>
      </div>
    </div>
    <div class="flex items-center" style="justify-content:space-between;margin:14px 0 18px">
      <label class="flex items-center gap-8" style="font-size:.84rem;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="remember" style="width:auto"> Remember me
      </label>
      <a href="{{ url_for('forgot_password_page') }}" style="font-size:.84rem;color:var(--primary);font-weight:600">Forgot Password?</a>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Login</button>
  </form>
  <p class="auth-foot">
    Don't have an account? <a href="{{ url_for('register') }}">Create Account</a>
  </p>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
(function () {
  var form = document.getElementById("loginForm");
  var btn = document.getElementById("loginBtn");

  function setError(id, has) {
    document.getElementById(id).classList.toggle("error", has);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var pass = document.getElementById("password").value;
    var idOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || /^[+0-9 ()-]{7,20}$/.test(email);
    setError("f-email", !idOk);
    setError("f-password", !pass);
    if (!idOk || !pass) return;

    setBtnLoading(btn, true);
    API.login(email, pass)
      .then(function (d) { redirectTo(d.redirect || "/dashboard"); })
      .catch(function (err) {
        setBtnLoading(btn, false, "Login");
        handleApiError(err);
      });
  });

})();
</script>
</body>
</html>
